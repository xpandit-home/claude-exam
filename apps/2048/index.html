<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../../index.html">&larr; Blog로 돌아가기</a>
    <button id="theme-toggle" aria-label="다크모드 전환">🌙</button>
  </header>

  <main>
    <h1 class="game-title">2048</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">SCORE</span>
        <span id="current-score">0</span>
      </div>
      <div class="score-box">
        <span class="label">BEST</span>
        <span id="best-score">0</span>
      </div>
    </div>

    <div class="controls">
      <button id="new-game-btn">새 게임</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-message"></p>
        <button id="overlay-retry-btn">다시 시작</button>
      </div>
    </div>

    <p class="hint">방향키 또는 스와이프로 타일을 이동하세요</p>
  </main>

  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="input.js"></script>
</body>
</html>
