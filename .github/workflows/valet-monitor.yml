name: valet-monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        default: run
        options:
          - run
          - verify
          - test-notify

concurrency:
  group: valet-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: valet-state-${{ github.run_id }}
          restore-keys: |
            valet-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: .state/valet-state.json
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            verify) python3 tools/valet-monitor/monitor.py --verify ;;
            test-notify) python3 tools/valet-monitor/monitor.py --test-notify ;;
            *) python3 tools/valet-monitor/monitor.py ;;
          esac

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: valet-state-${{ github.run_id }}
